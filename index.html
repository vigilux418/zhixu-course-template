<h1>算法与问题求解</h1>
<p class="lead">从生活直觉，走向清晰的计算思维</p>
<p>四讲短课，从找最大值的直觉出发，经过二分查找、时间复杂度与递归，建立一套能解释、能验证的计算思维。</p>
<h2>建立基础</h2>
<ol>
  <li><a href="01-what-is-an-algorithm.html">算法是什么</a>：把“找最大值”的直觉拆成输入、处理与输出，写成可以检查的算法。</li>
  <li><a href="02-binary-search.html">二分查找</a>：数据有序时，一次比较就能排除一半候选，最多比较几次也算得清。</li>
</ol>
<h2>进阶思考</h2>
<ol start="3">
  <li><a href="03-time-complexity.html">时间复杂度</a>：把“耗时”换成操作次数的增长趋势，看方法在数据变大后能走多远。</li>
  <li><a href="04-recursion.html">递归的思维</a>：先解决一个更小的自己，再把答案接回来：写出一定能停下的递归。</li>
</ol>
